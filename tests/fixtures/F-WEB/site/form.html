<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign up</title><link rel="stylesheet" href="/style.css"></head>
<body data-page="form">
<main>
<h1>Sign up</h1>
<form id="signup">
  <label for="name">Name</label><input id="name" name="name" required>
  <label for="email">Email</label><input id="email" name="email" type="email" required>
  <p><button id="submit" type="submit">Submit</button></p>
</form>
<p id="result"></p>
</main>
<script>
document.getElementById('signup').addEventListener('submit', async (e) => {
  e.preventDefault();
  const button = document.getElementById('submit');
  button.disabled = true;
  const body = JSON.stringify({ name: document.getElementById('name').value, email: document.getElementById('email').value });
  const r = await fetch('/api/signup', { method: 'POST', headers: { 'content-type': 'application/json' }, body });
  const out = document.getElementById('result');
  if (r.status === 201) {
    const rec = await r.json();
    out.className = 'ok';
    out.textContent = 'Thanks, ' + rec.name + '! Saved as record ' + rec.id + '.';
  } else {
    out.className = 'bad';
    out.textContent = 'Sign-up failed (' + r.status + ').';
    button.disabled = false;
  }
});
</script>
</body></html>
