name = "smoke"
version = "1"
description = "Five small Rust coding tasks: a smoke test, not a benchmark of model quality."
timeout_secs = 300

[[tasks]]
id = "add"
prompt = "Task add: implement `add` in src/lib.rs: the sum of two integers. The tests in tests/ show what is expected."
fixture = "tasks/add/repo"
protected = ["tests"]
hidden = "tasks/add/hidden"

[[tasks.checks]]
name = "builds"
run = ["cargo", "build", "--offline", "--quiet"]
weight = 1

[[tasks.checks]]
name = "visible tests"
run = ["cargo", "test", "--offline", "--quiet", "--test", "visible"]
weight = 1

[[tasks.checks]]
name = "hidden tests"
run = ["cargo", "test", "--offline", "--quiet", "--test", "hidden"]
weight = 3

