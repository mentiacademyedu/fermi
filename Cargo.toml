[workspace]
resolver = "2"
members = ["crates/fermi-core", "crates/fermi", "crates/fermi-desktop", "crates/acceptance-tests", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time", "fs", "signal", "net"] }

# Dev builds without full debug info: a fraction of the disk space, and
# backtraces still have file/line.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
