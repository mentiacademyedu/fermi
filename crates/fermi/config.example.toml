# ── Models ──────────────────────────────────────────────────────────────────
# Built in: claude:fable claude:opus claude:sonnet claude:haiku openai:gpt openai:image
# tier: 1 fast, 2 balanced, 3 strongest, 4 premium. auto = false keeps a model
# out of auto mode (still usable with -m or pinned/single).
